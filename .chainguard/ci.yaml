# Smoke-test workflow for `chainctl develop --with claude` (laptop credential
# forwarding). The develop job ships a shell + the Claude Code CLI.
#
# The Anthropic messages API rides the injected http://claude proxy, so the
# real credential stays on the laptop and never enters the guest. But the
# interactive claude TUI also (a) does a direct connectivity probe to the
# literal api.anthropic.com (ignoring ANTHROPIC_BASE_URL) and (b) calls
# platform.claude.com for statsig/telemetry. Under the default
# EGRESS_VIOLATION_DESTROY those stray DNS queries tear the guest down; under
# a hermetic policy they ENOTFOUND and the TUI refuses to start. So allow
# those hosts and use DENY (refuse anything else, keep the guest alive). The
# guest only ever holds the placeholder ANTHROPIC_API_KEY=proxy, so reaching
# api.anthropic.com directly leaks nothing; real messages still proxy.
name: ci
jobs:
  develop:
    environment:
      packages: [busybox, claude, git]
    network: NETWORK_MODE_EXTERNAL
    egress: [api.anthropic.com, platform.claude.com]
    egressPolicy: EGRESS_VIOLATION_DENY
    steps:
      - name: build
        cmd: [go, build, ./...]
