# Smoke-test workflow for `chainctl develop --with claude` (laptop credential
# forwarding). The `develop` job's environment ships a shell plus the Claude
# Code CLI; the session opens a shell in it and `claude` reaches
# http://claude/ (the forwarder on the laptop injects the real credential).
name: ci
jobs:
  develop:
    environment:
      packages: [busybox, claude-code, git]
    steps:
      - name: build
        cmd: [go, build, ./...]
